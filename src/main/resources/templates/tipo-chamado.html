<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tipos de chamado</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>
        <aside>
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </aside>
        <div class="toggle-btn btn btn-dark d-md-none"><span>&#9776;</span></div>
        <main class="container mt-4" th:fragment="content">
            <h1 class="mt-4">Tipos de chamado</h1>
            <section class="card mt-3">
                <div class="card-header" th:text="${tipoChamado.id == null ? 'Cadastrar tipo de chamado' : 'Editar tipo de chamado'}"></div>
                <div class="card-body">
                    <div class="alert alert-danger" role="alert" th:if="${erro != null}" th:text="${erro}"></div>
                    <form th:action="@{/tipo-chamado/salvar}" th:object="${tipoChamado}" method="post">
                        <input type="hidden" th:field="*{id}">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label for="nome" class="form-label">Nome</label>
                                <input type="text" id="nome" th:field="*{nome}" class="form-control" maxlength="120" required>
                            </div>
                            <div class="col-md-8">
                                <label for="descricao" class="form-label">Descrição</label>
                                <input type="text" id="descricao" th:field="*{descricao}" class="form-control" maxlength="300">
                            </div>
                        </div>
                        <div class="mt-3">
                            <button type="submit" class="btn btn-success">Salvar</button>
                            <a th:if="${tipoChamado.id != null}" th:href="@{/tipo-chamado}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </section>

            <div class="table-responsive mt-4">
                <table class="table table-bordered table-striped align-middle">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Descrição</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${tiposChamado}">
                            <td th:text="${item.nome}"></td>
                            <td th:text="${item.descricao}"></td>
                            <td class="text-nowrap">
                                <a th:href="@{/tipo-chamado/editar/{id}(id=${item.id})}" class="btn btn-warning btn-sm">Editar</a>
                                <form th:action="@{/tipo-chamado/deletar/{id}(id=${item.id})}" method="post" class="d-inline"
                                      onsubmit="return confirm('Deseja excluir este tipo de chamado?');">
                                    <button type="submit" class="btn btn-danger btn-sm">Excluir</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(tiposChamado)}">
                            <td colspan="3" class="text-center">Nenhum tipo de chamado cadastrado.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
        <script th:src="@{/js/script.js}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
