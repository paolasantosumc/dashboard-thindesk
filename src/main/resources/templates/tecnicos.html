<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Técnicos</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>

    <body>
        <aside>
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </aside>

        <div class="toggle-btn btn btn-dark d-md-none">
            <span>&#9776;</span>
        </div>

        <main class="container mt-4" th:fragment="content">
            <div class="d-flex justify-content-between align-items-center mt-4">
                <h1>Técnicos</h1>
                <a th:href="@{/tecnicos/novo}" class="btn btn-primary">
                    <i class="bi bi-person-plus"></i> Novo técnico
                </a>
            </div>

            <section class="card mt-3">
                <div class="card-header" th:text="${tecnico.id == null ? 'Cadastrar técnico' : 'Editar técnico'}"></div>
                <div class="card-body">
                    <div class="alert alert-danger" role="alert" th:if="${erro != null}" th:text="${erro}"></div>
                    <form th:action="@{/tecnicos/salvar}" th:object="${tecnico}" method="post">
                        <input type="hidden" th:field="*{id}">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="nome" class="form-label">Nome</label>
                                <input type="text" id="nome" th:field="*{nome}" class="form-control" maxlength="120" required>
                            </div>
                            <div class="col-md-6">
                                <label for="especialidade" class="form-label">Especialidade</label>
                                <input type="text" id="especialidade" th:field="*{especialidade}" class="form-control" maxlength="120">
                            </div>
                            <div class="col-md-6">
                                <label for="telefone" class="form-label">Telefone</label>
                                <input type="tel" id="telefone" th:field="*{telefone}" class="form-control" maxlength="30">
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label">E-mail</label>
                                <input type="email" id="email" th:field="*{email}" class="form-control" maxlength="160">
                            </div>
                        </div>
                        <div class="mt-3">
                            <button type="submit" class="btn btn-success">Salvar</button>
                            <a th:if="${tecnico.id != null}" th:href="@{/tecnicos}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </section>

            <div class="table-responsive mt-4">
                <table class="table table-bordered table-striped align-middle">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Especialidade</th>
                            <th>Telefone</th>
                            <th>E-mail</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${tecnicos}">
                            <td th:text="${item.nome}"></td>
                            <td th:text="${item.especialidade}"></td>
                            <td th:text="${item.telefone}"></td>
                            <td th:text="${item.email}"></td>
                            <td class="text-nowrap">
                                <a th:href="@{/tecnicos/editar/{id}(id=${item.id})}" class="btn btn-warning btn-sm">Editar</a>
                                <form th:action="@{/tecnicos/deletar/{id}(id=${item.id})}" method="post" class="d-inline"
                                      onsubmit="return confirm('Deseja excluir este técnico?');">
                                    <button type="submit" class="btn btn-danger btn-sm">Excluir</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(tecnicos)}">
                            <td colspan="5" class="text-center">Nenhum técnico cadastrado.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
        <script th:src="@{/js/script.js}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
